# ----------------------------------------------------------------------------------------------------------------------
# 核心配置
# ----------------------------------------------------------------------------------------------------------------------
spring:
  datasource:
    url: "jdbc:mysql://host.docker.internal:3306/claude_playground?useSSL=false&useUnicode=true&characterEncoding=utf-8&autoReconnect=true&allowPublicKeyRetrieval=true"
    username: "root"
    password: "root"

# ----------------------------------------------------------------------------------------------------------------------
# p6spy配置
# ----------------------------------------------------------------------------------------------------------------------
decorator:
  datasource:
    p6spy:
      enable-logging: false

# ----------------------------------------------------------------------------------------------------------------------
# 日志配置
# ----------------------------------------------------------------------------------------------------------------------
claude-playground:
  logback:
    log-home: "/tmp"
    log-name: "claude-playground"
