# ----------------------------------------------------------------------------------------------------------------------
# 核心配置
# ----------------------------------------------------------------------------------------------------------------------
spring:
  devtools:
    restart:
      enabled: false
  datasource:
    url: "jdbc:mysql://localhost:3306/claude_playground?useSSL=false&useUnicode=true&characterEncoding=utf-8&autoReconnect=true&allowPublicKeyRetrieval=true"
    username: "root"
    password: "root"
  data:
    redis:
      host: "localhost"
      port: 6379
      password: "redis"

# ----------------------------------------------------------------------------------------------------------------------
# p6spy配置
# ----------------------------------------------------------------------------------------------------------------------
decorator:
  datasource:
    p6spy:
      enable-logging: true
      log-format: "[SQL] %(currentTime) | %(executionTime)ms | %(category) | %(sqlSingleLine)"

# ----------------------------------------------------------------------------------------------------------------------
# 日志配置
# ----------------------------------------------------------------------------------------------------------------------
claude-playground:
  logback:
    log-home: "/tmp"
    log-name: "claude-playground"
