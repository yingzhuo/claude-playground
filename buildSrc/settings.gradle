pluginManagement {
	repositories {
		mavenLocal()
		maven { url = 'https://maven.aliyun.com/repository/public/' }
		gradlePluginPortal()
		mavenCentral()
		google()
	}
}

dependencyResolutionManagement {
	var versionsToml = file('../gradle/libs.versions.toml')
	if (versionsToml.exists()) {
		versionCatalogs {
			create('libs', { from(versionsToml) })
		}
	}

	repositories {
		mavenLocal()
		maven { url = 'https://maven.aliyun.com/repository/public/' }
		mavenCentral()
	}

	repositoriesMode = RepositoriesMode.FAIL_ON_PROJECT_REPOS
}
